# 跟随上游 chenyme/grok2api 的 release,自动打上 patch/include-optin 分支的补丁,
# 跑全量后端测试后构建 arm64 镜像推到 ghcr.io/<owner>/grok2api:<tag>-include-optin。
# 补丁合不上或测试失败 → 工作流失败,GitHub 会发邮件通知。
name: Build patched image

on:
  schedule:
    - cron: "17 1 * * *" # 每天 09:17(北京时间)检查一次
  workflow_dispatch:
    inputs:
      tag:
        description: "上游 tag(留空 = 最新 release)"
        required: false
      force:
        description: "镜像已存在也重新构建"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: build-patched
  cancel-in-progress: false

env:
  UPSTREAM: chenyme/grok2api
  PATCH_BRANCH: patch/include-optin
  SUFFIX: include-optin

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.r.outputs.tag }}
      image: ${{ steps.r.outputs.image }}
      skip: ${{ steps.r.outputs.skip }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force }}
        run: |
          tag="$INPUT_TAG"
          [ -z "$tag" ] && tag=$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/grok2api"
          skip=false
          if [ "$FORCE" != "true" ] && docker manifest inspect "$image:$tag-$SUFFIX" >/dev/null 2>&1; then skip=true; fi
          echo "upstream tag=$tag image=$image skip=$skip"
          { echo "tag=$tag"; echo "image=$image"; echo "skip=$skip"; } >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout upstream tag
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 0

      - name: Apply patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch "https://github.com/$GITHUB_REPOSITORY.git" "$PATCH_BRANCH"
          base=$(git merge-base HEAD FETCH_HEAD)
          git log --oneline "$base..FETCH_HEAD"
          git cherry-pick "$base..FETCH_HEAD"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test backend
        working-directory: backend
        run: go test ./...

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ needs.resolve.outputs.image }}:${{ needs.resolve.outputs.tag }}-${{ env.SUFFIX }}
            ${{ needs.resolve.outputs.image }}:latest-${{ env.SUFFIX }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=chenyme/grok2api ${{ needs.resolve.outputs.tag }} + ${{ env.PATCH_BRANCH }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max
          provenance: false
          sbom: false
